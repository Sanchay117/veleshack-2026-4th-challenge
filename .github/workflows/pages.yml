# Publish the project website (site/) to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
# On a fork, also enable workflows once under the Actions tab.
#
# Builds with `make site` and deploys; it never commits to the repository.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
